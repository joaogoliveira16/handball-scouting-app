# Cabeçalhos de segurança de todas as respostas do site (incluída pelo nginx.conf).
# O nginx só herda os add_header do servidor para um location que não tenha nenhum seu: por isso este ficheiro é
# incluído no servidor e outra vez em cada location com add_header próprio (o teste tests/unidade/nginx.test.mjs confere).

# O que a página pode carregar: só do próprio site. 'wasm-unsafe-eval' é para o leitor de fotos (Tesseract, WebAssembly),
# blob: para o worker dele e para as fotos; style-src leva 'unsafe-inline' porque a interface pinta alguns estilos em linha.
# connect-src 'self' cobre os pedidos à API e a ligação em direto (WebSocket) ao mesmo endereço.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# A app não vai dentro de outras páginas (cliques escondidos), nem o browser adivinha tipos de ficheiro
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;

# As ligações de partilha levam um código no endereço (?c=...): não o mostres a outros sites
add_header Referrer-Policy "no-referrer" always;

# Só a própria app pode pedir a câmara; mais nada
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=()" always;

# Só atrás de HTTPS (o proxy avisa em X-Forwarded-Proto): a partir daí o browser nunca mais usa HTTP simples neste endereço
add_header Strict-Transport-Security $hsts always;
