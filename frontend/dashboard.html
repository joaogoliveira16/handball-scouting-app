<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e1b33">
  <!-- O link de partilha leva o código secreto do jogo: não deve aparecer em pesquisas nem em referências -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Dashboard · Scouting de Andebol</title>
  <link rel="stylesheet" href="css/estilo.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
  <header class="topo topo-jogo">
    <a class="voltar" id="voltar" href="./" aria-label="Voltar à lista de jogos" hidden>←</a>
    <div class="placar">
      <span class="slot-escudo" id="escudo-casa"></span>
      <span class="eq eq-casa" id="nome-casa">Casa</span>
      <strong id="golos-casa">0</strong>
      <span>–</span>
      <strong id="golos-fora">0</strong>
      <span class="eq eq-fora" id="nome-fora">Fora</span>
      <span class="slot-escudo" id="escudo-fora"></span>
    </div>
    <span class="relogio-leitura" id="relogio-dash" title="Relógio do jogo (o do banco)" hidden>00:00</span>
    <button type="button" class="botao-topo" id="partilhar" title="Copiar o link para quem quiser ver o jogo em direto" hidden>Copiar link</button>
    <a class="botao-topo" id="excel-jogo" href="#" download title="Exportar as estatísticas do jogo para Excel">⬇ Excel</a>
    <span class="ligacao" id="ligacao">a ligar…</span>
  </header>

  <main id="painel" class="dash">
    <p class="vazio largo">A aguardar dados do jogo…</p>
  </main>

  <div id="aviso" class="aviso" role="status"></div>
  <script src="lib/signalr.min.js"></script>
  <script type="module" src="js/dashboard.js"></script>
</body>
</html>
