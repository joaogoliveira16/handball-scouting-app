<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0e1b33">
  <title>Banco · Scouting de Andebol</title>
  <link rel="stylesheet" href="css/estilo.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
  <header class="topo topo-jogo">
    <a class="voltar" href="./" aria-label="Voltar à lista de jogos">←</a>
    <div class="placar">
      <span class="slot-escudo" id="escudo-casa"></span>
      <span class="eq eq-casa" id="nome-casa">Casa</span>
      <strong id="golos-casa">0</strong>
      <span>–</span>
      <strong id="golos-fora">0</strong>
      <span class="eq eq-fora" id="nome-fora">Fora</span>
      <span class="slot-escudo" id="escudo-fora"></span>
    </div>
    <div class="relogio">
      <button id="btn-parte" type="button" title="Mudar de parte">1.ª parte</button>
      <span class="tempo" id="tempo">00:00</span>
      <button id="btn-relogio" type="button" title="Iniciar / pausar o relógio">▶</button>
      <button id="btn-ajustar" type="button" title="Ajustar o minuto de jogo">✎</button>
    </div>
    <button type="button" class="botao-topo" id="btn-terminar" title="Marcar o fim do jogo: o banco deixa de registar eventos">Terminar jogo</button>
    <span class="pendentes" id="pendentes" role="status" hidden title="Eventos guardados neste tablet que ainda não chegaram ao servidor: seguem sozinhos quando houver rede"></span>
    <span class="ligacao" id="ligacao">a ligar…</span>
  </header>

  <!-- Aparece quando alguém está em campo a menos (2 minutos, vermelho) ou uma equipa ataca em 7×6 -->
  <div class="faixa-numerica" id="faixa-numerica" hidden></div>

  <!-- Aparece durante um time-out: o relógio de jogo fica parado e conta-se o minuto do time-out -->
  <div class="faixa-timeout" id="faixa-timeout" role="timer" hidden>
    <b>Time-out</b>
    <span class="timeout-equipa" id="timeout-equipa"></span>
    <b class="timeout-tempo" id="timeout-tempo">1:00</b>
    <span class="timeout-nota" id="timeout-nota">relógio de jogo parado</span>
    <button id="btn-fim-timeout" type="button" title="Acabar o time-out e pôr o relógio de jogo a andar">Retomar o jogo</button>
  </div>

  <!-- Aparece quando o jogo foi terminado: o registo fica fechado até o reabrirem -->
  <div class="faixa-terminado" id="faixa-terminado" role="status" hidden>
    <b>Jogo terminado</b>
    <span class="terminado-nota">O registo está fechado.</span>
    <button id="btn-reabrir" type="button" title="Voltar a registar neste jogo">Reabrir o jogo</button>
  </div>

  <main class="banco">
    <section>
      <div class="a-atacar" id="seletor-equipa"></div>
      <svg id="campo" class="campo"></svg>
      <div class="dica" id="dica"></div>
    </section>

    <section>
      <h2 style="margin-top:0">1 · Jogador que rematou</h2>
      <p class="nota-convocatoria" id="nota-convocatoria" hidden></p>
      <div class="grelha-jogadores" id="jogadores"></div>

      <h2>2 · Resultado (regista o remate)</h2>
      <div class="resultados" id="resultados"></div>

      <div class="linha-opcoes">
        <div class="segmentos" id="situacoes"></div>
        <label class="campo-gr">Guarda-redes <select id="guarda-redes"></select></label>
      </div>
      <!-- A defesa do adversário fica escolhida até a mudares: cada remate em ataque posicional leva a que estiver marcada -->
      <div class="linha-opcoes" id="linha-sistema">
        <span class="rotulo-opcao" id="rotulo-sistema">Defesa do adversário</span>
        <div class="segmentos" id="sistemas" role="group" aria-labelledby="rotulo-sistema"></div>
      </div>

      <h2>Outros eventos</h2>
      <div class="outros" id="outros"></div>

      <h2 class="titulo-com-acao">
        <span>Últimos eventos</span>
        <button type="button" id="btn-desfazer">↶ Desfazer último</button>
      </h2>
      <ol class="lista-eventos" id="ultimos"></ol>
      <p class="mais-eventos"><a id="ver-todos-eventos" href="./">Ver todos os eventos e corrigir</a></p>
    </section>
  </main>

  <!-- Abre ao tocar em "Golo" ou "Defesa": o adjunto marca na baliza onde a bola entrou ou onde o guarda-redes a defendeu -->
  <div class="janela-fundo" id="janela-baliza" hidden>
    <div class="janela cartao" role="dialog" aria-modal="true" aria-labelledby="titulo-baliza">
      <h2 id="titulo-baliza"></h2>
      <p class="janela-sub" id="sub-baliza"></p>
      <svg id="baliza" class="baliza"></svg>
      <p class="janela-nota" id="nota-baliza"></p>
      <div class="janela-acoes">
        <button type="button" class="botao perigo" id="baliza-cancelar">Cancelar</button>
        <button type="button" class="botao suave" id="baliza-sem-local">Registar sem local</button>
      </div>
    </div>
  </div>

  <div id="aviso" class="aviso" role="status"></div>
  <script src="lib/signalr.min.js"></script>
  <script type="module" src="js/banco.js"></script>
</body>
</html>
