server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Pedidos HTTP normais para a API
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets (SignalR): precisa dos cabeçalhos Upgrade e de uma ligação que fique aberta
    location /hub/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Leitor de fotos (OCR, cerca de 5 MB): só se descarrega quando alguém lê uma foto; fica uma semana na cache
    # do browser e vai comprimido. Se mudares estes ficheiros, muda também o nome da pasta ou espera que expirem.
    location /lib/tesseract/ {
        gzip on;
        gzip_types text/javascript application/javascript;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    # O service worker nunca pode ficar em cache: é ele que decide o que o tablet guarda para usar sem rede.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Ficheiros estáticos (páginas, JS, CSS). Rever sempre o HTML/JS ao atualizar a app.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
