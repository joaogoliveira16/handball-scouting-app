# Atrás de outro proxy com HTTPS (Tailscale Funnel, Caddy...), o nginx recebe HTTP simples e o proxy avisa em
# X-Forwarded-Proto que por fora é HTTPS. Mantém-se esse aviso (a API usa-o para marcar o cookie da sessão como Secure);
# sem proxy à frente, vale o esquema do próprio pedido.
map $http_x_forwarded_proto $proto_externo {
    default $scheme;
    https   https;
}

# Cabeçalho HSTS: só vai quando por fora é HTTPS (com valor vazio o nginx não o envia)
map $proto_externo $hsts {
    https   "max-age=31536000";
    default "";
}

server {
    listen 80;
    server_name _;

    include /etc/nginx/cabecalhos-seguranca.conf;

    # Compressão: o texto (páginas, JS, CSS e o JSON da API) viaja a um terço do tamanho; no wifi de um pavilhão nota-se.
    # As respostas da API não levam segredos no corpo (a sessão vai no cookie), por isso comprimi-las é seguro.
    # Excel, imagens e letras já vão comprimidos e ficam de fora.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json image/svg+xml text/plain;

    root /usr/share/nginx/html;
    index index.html;

    # Pedidos HTTP normais para a API
    location /api/ {
        proxy_hide_header X-Content-Type-Options;   # o nginx já o põe (cabecalhos-seguranca.conf); a API também, em alguns pedidos
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_externo;
    }

    # WebSockets (SignalR): precisa dos cabeçalhos Upgrade e de uma ligação que fique aberta
    location /hub/ {
        proxy_hide_header X-Content-Type-Options;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proto_externo;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Leitor de fotos (OCR, cerca de 5 MB): só se descarrega quando alguém lê uma foto; fica uma semana na cache
    # do browser e vai comprimido. Se mudares estes ficheiros, muda também o nome da pasta ou espera que expirem.
    location /lib/tesseract/ {
        gzip on;
        gzip_types text/javascript application/javascript;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/cabecalhos-seguranca.conf;
    }

    # Letras: nunca mudam (o peso vai no nome do ficheiro), por isso ficam um ano na cache sem voltar a perguntar.
    # Se trocares uma letra, dá-lhe outro nome de ficheiro.
    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/cabecalhos-seguranca.conf;
    }

    # Ícones da app (ecrã inicial do tablet): uma semana
    location /icons/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
        include /etc/nginx/cabecalhos-seguranca.conf;
    }

    # O service worker nunca pode ficar em cache: é ele que decide o que o tablet guarda para usar sem rede.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        include /etc/nginx/cabecalhos-seguranca.conf;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        include /etc/nginx/cabecalhos-seguranca.conf;
    }

    # Ficheiros estáticos (páginas, JS, CSS). Rever sempre o HTML/JS ao atualizar a app.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
        include /etc/nginx/cabecalhos-seguranca.conf;
    }
}
