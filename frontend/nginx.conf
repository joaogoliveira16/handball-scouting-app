server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Respostas comprimidas (gzip) quando o browser o aceita: páginas, JS, CSS, manifest e o JSON da API que ainda
    # não venha comprimido (a API já comprime com brotli ou gzip; o que chega comprimido passa como está).
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/css text/javascript application/javascript application/json application/manifest+json
               image/svg+xml text/plain;

    # Pedidos HTTP normais para a API
    location /api/ {
        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSockets (SignalR): precisa dos cabeçalhos Upgrade e de uma ligação que fique aberta
    location /hub/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    # Leitor de fotos (OCR, cerca de 5 MB): só se descarrega quando alguém lê uma foto; fica uma semana na cache
    # do browser e vai comprimido. Se mudares estes ficheiros, muda também o nome da pasta ou espera que expirem.
    location /lib/tesseract/ {
        gzip_types text/javascript application/javascript application/wasm;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=604800";
    }

    # Letras: nunca mudam (o nome do ficheiro diz a família e o peso), por isso ficam 30 dias na cache do browser
    # em vez de se perguntar ao servidor em cada página. Se trocares uma letra, dá-lhe outro nome.
    location /fonts/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }

    # O service worker nunca pode ficar em cache: é ele que decide o que o tablet guarda para usar sem rede.
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Ficheiros estáticos (páginas, JS, CSS). Rever sempre o HTML/JS ao atualizar a app.
    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "no-cache";
    }
}
