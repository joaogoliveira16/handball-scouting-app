<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Equipas · Scouting de Andebol</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>
  <header class="topo">
    <a class="marca" href="./"><span class="marca-icone" aria-hidden="true"></span><span>Scouting <b>Andebol</b></span></a>
    <nav class="menu" aria-label="Principal">
      <a href="./">Jogos</a>
      <a href="equipas.html" aria-current="page">Equipas</a>
    </nav>
    <div class="conta-menu" id="conta-menu"></div>
  </header>

  <main class="pagina">
    <h1>A tua equipa</h1>
    <p class="sub">Junta os jogadores ao plantel da tua equipa. O adversário indica-se ao criar o jogo e os convocados de cada jogo escolhem-se na página <strong>Convocatória</strong>.</p>

    <div class="duas-colunas">
      <aside class="cartao">
        <h2 id="titulo-equipas">Equipa</h2>
        <ul class="lista-equipas" id="equipas"></ul>
        <form id="form-equipa" class="formulario" novalidate hidden>
          <label class="largo">Nome da tua equipa
            <input id="nome-equipa" maxlength="80" placeholder="Nome da equipa" autocomplete="off" required>
          </label>
          <p class="erro-formulario largo" id="erro-equipa" role="alert"></p>
          <button class="botao primario largo" type="submit">Criar a minha equipa</button>
        </form>
      </aside>

      <section class="cartao" id="plantel">
        <p class="vazio">A carregar…</p>
      </section>
    </div>
  </main>

  <div id="aviso" class="aviso" role="status"></div>
  <script type="module" src="js/equipas.js"></script>
</body>
</html>
