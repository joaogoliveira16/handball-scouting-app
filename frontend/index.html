<!doctype html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <title>Jogos · Scouting de Andebol</title>
  <link rel="stylesheet" href="css/estilo.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
</head>
<body>
  <header class="topo">
    <a class="marca" href="./"><span class="marca-icone" aria-hidden="true"></span><span>Scouting <b>Andebol</b></span></a>
    <nav class="menu" aria-label="Principal">
      <a href="./" aria-current="page">Jogos</a>
      <a href="equipas.html">Equipas</a>
      <a href="estatisticas.html">Estatísticas</a>
    </nav>
    <div class="conta-menu" id="conta-menu"></div>
  </header>

  <main class="pagina">
    <div class="cabecalho-pagina">
      <div>
        <h1>Jogos</h1>
        <p class="sub">Cria o jogo, escolhe os convocados e regista no Banco. O treinador e os adeptos veem o Dashboard em direto e no fim exportas tudo para Excel.</p>
      </div>
    </div>

    <details class="cartao novo-jogo" id="novo-jogo" hidden>
      <summary>Novo jogo</summary>
      <form id="form-jogo" class="formulario" novalidate>
        <p class="largo" id="equipa-jogo"></p>
        <label>A tua equipa joga
          <select id="lado">
            <option value="casa">em casa</option>
            <option value="fora">fora</option>
          </select>
        </label>
        <label>Adversário
          <input id="adversario" list="adversarios" maxlength="80" placeholder="Nome da equipa adversária" autocomplete="off" required>
          <datalist id="adversarios"></datalist>
        </label>
        <label>Local <input id="local" maxlength="120" placeholder="Pavilhão…" autocomplete="off"></label>
        <label>Data e hora <input id="data-hora" type="datetime-local"></label>
        <p class="erro-formulario largo" id="erro-jogo" role="alert"></p>
        <div class="largo acoes-formulario">
          <button class="botao primario" type="submit" id="criar-jogo">Criar jogo e escolher convocados</button>
          <a class="botao-link suave" href="equipas.html">Plantel da minha equipa</a>
        </div>
      </form>
    </details>

    <p class="aviso-fila" id="fila-pendente" role="status" hidden></p>
    <h2 class="seccao" id="titulo-jogos">Os teus jogos</h2>
    <div id="jogos"><p class="vazio">A carregar jogos…</p></div>
  </main>

  <div id="aviso" class="aviso" role="status"></div>
  <script type="module" src="js/index.js"></script>
</body>
</html>
