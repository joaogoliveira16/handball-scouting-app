name: handball-scouting

services:
  # 1) Base de dados. Os scripts de db/init correm só na primeira vez (volume vazio).
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-scouting}
      POSTGRES_USER: ${POSTGRES_USER:-scouting}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scouting}
    volumes:
      - dados_pg:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"   # só acessível a partir deste computador (DBeaver, psql...)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # 1b) Atualiza a base de dados de quem já tinha a app instalada: corre, em cada arranque, os scripts
  #     db/init/05 em diante (são todos repetíveis) e termina. Os 01 a 04 só correm na primeira vez, no contentor "db".
  migrar:
    image: postgres:16-alpine
    restart: "no"
    environment:
      PGHOST: db
      PGDATABASE: ${POSTGRES_DB:-scouting}
      PGUSER: ${POSTGRES_USER:-scouting}
      PGPASSWORD: ${POSTGRES_PASSWORD:-scouting}
    volumes:
      - ./db/init:/migracoes:ro
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        # espera pela ligação TCP (na primeira vez a base de dados ainda está a ser criada)
        for i in $$(seq 1 60); do pg_isready -q && break; sleep 1; done
        for f in /migracoes/*.sql; do
          case "$$f" in /migracoes/0[1-4]_*) continue;; esac
          echo "A atualizar a base de dados: $$f"
          psql -v ON_ERROR_STOP=1 -q -f "$$f"
        done

  # 2) API ASP.NET Core + hub SignalR (WebSockets)
  api:
    build: ./api
    restart: unless-stopped
    environment:
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB:-scouting};Username=${POSTGRES_USER:-scouting};Password=${POSTGRES_PASSWORD:-scouting}
      # Fuso horário das datas nos ficheiros Excel
      Exportacao__FusoHorario: ${FUSO_HORARIO:-Europe/Lisbon}
      # Email de confirmação das contas novas. Por omissão vai para a caixa de correio de teste (serviço "mailpit",
      # http://localhost:8025). Para enviar emails a sério define EMAIL_HOST, EMAIL_PORTA, EMAIL_UTILIZADOR, EMAIL_SENHA,
      # EMAIL_SSL e EMAIL_DE num ficheiro .env (ver o README).
      Email__Host: ${EMAIL_HOST:-mailpit}
      Email__Porta: ${EMAIL_PORTA:-1025}
      Email__Utilizador: ${EMAIL_UTILIZADOR:-}
      Email__Senha: ${EMAIL_SENHA:-}
      Email__UsarSsl: ${EMAIL_SSL:-false}
      Email__De: ${EMAIL_DE:-scouting@localhost}
      # Endereço da app visto por quem recebe o email (vai dentro do link de confirmação)
      App__UrlPublico: ${URL_PUBLICO:-http://localhost:8080}
      # Quem administra a app: os emails (separados por vírgula) das contas que passam a admin quando entram. É assim que
      # nasce o primeiro admin; os outros escolhem-se na página de administração. Sem nada, ninguém é admin.
      Administracao__Emails: ${ADMIN_EMAILS:-}
    depends_on:
      migrar:
        condition: service_completed_successfully
      mailpit:
        condition: service_started

  # 2b) Caixa de correio de teste: apanha os emails que a API envia (nenhum sai para a internet).
  #     Abre http://localhost:8025 para ver o email de confirmação de uma conta nova.
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    ports:
      - "127.0.0.1:8025:8025"   # só acessível a partir deste computador

  # 3) Frontend (nginx): páginas estáticas e proxy para /api e /hub
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "${PORTA_WEB:-8080}:80"
    depends_on:
      - api

volumes:
  dados_pg:
